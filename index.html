<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מלך הארץ | כמה אתה באמת מכיר</title>
  <meta name="description" content="כמה אתה באמת מכיר מה קורה בארץ שלנו — שאלות ידע והישגים" />
  <meta property="og:title" content="מלך הארץ | כמה אתה באמת מכיר" />
  <meta property="og:description" content="כמה אתה באמת מכיר מה קורה בארץ שלנו" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand-chip">
        <img class="brand-logo" src="assets/logo-final.png" alt="הציונות הדתית" />
      </div>
      <div class="progress-panel" aria-hidden="true">
        <div class="progress-meta">
          <span>התקדמות</span>
          <span id="progressLabel">0%</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </header>

    <!-- Start -->
    <section class="screen active" id="screen-start">
      <div class="hero">
        <h1 class="hero-brand"><span>מלך הארץ</span></h1>
        <h2>כמה אתה באמת מכיר מה קורה בארץ שלנו</h2>
        <button class="cta" id="startBtn" type="button">יאללה נתחיל</button>
        <figure class="hero-mascot">
          <img
            src="assets/king-of-the-land.png"
            alt="מלך הארץ — נער ציוני דתי עם גיטרה"
            width="420"
            height="560"
          />
        </figure>
      </div>
    </section>

    <!-- Quiz -->
    <section class="screen" id="screen-quiz">
      <div class="quiz-head">
        <div class="cat-pill" id="category">📈 כלכלה</div>
        <h2 class="question-title" id="question">שאלה</h2>
        <div class="score-chip" id="scoreChip">שאלה 1</div>
      </div>
      <div class="cubes" id="cubes"></div>
    </section>

    <div class="feedback" id="feedback" hidden>
      <div class="feedback-backdrop" aria-hidden="true"></div>
      <div class="feedback-dialog" role="dialog" aria-modal="true" aria-labelledby="achievementTitle">
        <strong id="feedbackTitle">נכון!</strong>
        <div class="achievement-card">
          <span class="achievement-kicker">ההישג שלנו</span>
          <h3 class="achievement-title" id="achievementTitle"></h3>
          <p id="feedbackText"></p>
        </div>
        <button class="cta" id="nextBtn" type="button">הבא</button>
      </div>
    </div>

    <!-- Results -->
    <section class="screen" id="screen-result">
      <div class="results">
        <figure class="results-mascot" aria-hidden="true">
          <img
            src="assets/king-of-the-land.png"
            alt=""
            width="280"
            height="373"
          />
        </figure>
        <p class="results-mascot-line" id="resultsMascotLine">מלך הארץ גאה בך</p>
        <div class="results-ring" id="resultRing">
          <div class="results-score" id="resultScore">0<small>מתוך 3</small></div>
        </div>
        <h2 id="resultTitle">כל הכבוד!</h2>
        <p id="resultText"></p>
        <div class="results-actions">
          <button class="cta" id="replayBtn" type="button">שחק שוב</button>
          <button class="cta secondary" id="shareBtn" type="button">שתף תוצאה</button>
        </div>
      </div>
    </section>
  </div>

  <script src="icons.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
